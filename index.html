<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Morning and evening azkar, prayer times for your location, and a daily prayer log." />
    <!-- These two follow the system colour scheme. When Appearance is set to Light or Dark,
         the app puts a third one, without a media query, ahead of them (src/app/themeColor.ts). -->
    <meta name="theme-color" content="#F5F1E8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0E1513" media="(prefers-color-scheme: dark)" />
    <meta name="application-name" content="Azkar" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- iOS Home Screen app. "default" lets the status bar take the theme colour with readable text in both themes. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Azkar" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="icon" href="./favicon.ico" sizes="48x48" />
    <link rel="icon" href="./favicon.svg" sizes="any" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./apple-touch-icon-180x180.png" />
    <!-- The web manifest link is added by vite-plugin-pwa at build time. -->
    <title>Azkar</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
